name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: typecheck · lint · test (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: kaithangu
          POSTGRES_USER: kaithangu
          # Throwaway credential for the ephemeral CI container only.
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaithangu -d kaithangu"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3
        env:
          RABBITMQ_DEFAULT_USER: kaithangu
          RABBITMQ_DEFAULT_PASS: ci-only-password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://kaithangu:ci-only-password@localhost:5432/kaithangu
      DATABASE_URL_TEST: postgres://kaithangu:ci-only-password@localhost:5432/kaithangu_test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://kaithangu:ci-only-password@localhost:5672
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Reads the Bun version from "packageManager" in package.json.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Initialise databases (same script as docker compose)
        run: psql "postgres://kaithangu:ci-only-password@localhost:5432/kaithangu" -v ON_ERROR_STOP=1 -f infra/db/init.sql

      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run lint
      # apps/ml is tested in its own job with uv.
      - run: bunx turbo run test --filter='!ml'
      - run: bun run build
      - run: bun run smoke:datastores

  ml:
    name: pytest (apps/ml)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: apps/ml
          enable-cache: true

      - run: uv sync --locked
      - run: uv run pytest
