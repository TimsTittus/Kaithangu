# data/seed/kerala_rates.yaml
# Seeded into states / state_config / state_trade_rates by packages/db/src/seed/rates.ts.
#
# TODO_VERIFY: every value below with is_placeholder: true is an OBVIOUS ROUND
# PLACEHOLDER, not an official rate. Replace it with a verified figure and set
# is_placeholder: false. Money is integer paise (10000 paise = Rs 100).
state:
  code: KL
  name_key: state.KL
  active: true
  pincode_state_name: KERALA # exact `statename` in data/raw/pincodes.csv

state_config:
  welfare_pct: 5.00 # TODO_VERIFY placeholder
  platform_fee_pct: 5.00 # TODO_VERIFY placeholder
  gst_pct_on_platform_fee: 18.00 # TODO_VERIFY placeholder
  default_locale: ml
  locales: [ml, en, hi, ta]
  timezone: Asia/Kolkata
  is_placeholder: true

# Per-trade pricing inputs (AGENTS.md 6.2). All TODO_VERIFY placeholders: the
# same round numbers for every trade until verified rates are supplied.
state_trade_rates:
  plumber: &placeholder_rate
    wage_floor_per_hour_paise: 10000 # TODO_VERIFY placeholder (Rs 100/h)
    min_billable_minutes: 60 # TODO_VERIFY placeholder
    visit_charge_paise: 5000 # TODO_VERIFY placeholder (Rs 50)
    emergency_surcharge_pct: 25.00 # TODO_VERIFY placeholder
    is_placeholder: true
  electrician: *placeholder_rate
  carpenter: *placeholder_rate
  painter: *placeholder_rate
  domestic_help: *placeholder_rate
  caregiver: *placeholder_rate
  driver: *placeholder_rate
  gardener: *placeholder_rate
  cleaner: *placeholder_rate
  technician: *placeholder_rate

